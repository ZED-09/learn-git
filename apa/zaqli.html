<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - SQL Injection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #dc3545;
            font-size: 14px;
        }
        
        .info p {
            margin: 5px 0;
            color: #666;
        }
        
        .info strong {
            color: #dc3545;
        }
        
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login Form - SQL Injection Test</h2>
        
        <div class="warning">
            ⚠️ Halaman ini sengaja dibuat rentan terhadap SQL injection!
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        <div class="info">
            <p><strong>🔴 SQL Injection Test Examples:</strong></p>
        </div>
        
        
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simulasi query SQL yang rentan
            const sqlQuery = `SELECT * FROM users WHERE username = '${username}' AND password = '${password}'`;
            
           return {
                        success: true,
                        message: "SQL INJECTION BERHASIL! Anda berhasil login tanpa password valid!",
                        type: "injection"
                    };
                }

            // Simulasi database sederhana
            const users = [
                { username: 'admin', password: 'admin123' },
                { username: 'user', password: 'user123' },
                { username: 'test', password: 'test123' }
            ];
            
            // Fungsi untuk memeriksa login (simulasi rentan)
            function checkLogin(username, password) {
                // INI ADALAH SIMULASI RENTAN SQL INJECTION
                // JANGAN GUNAKAN INI DI PRODUCTION!
                
                // Deteksi pola SQL injection
                if (username.includes("' OR '") || username.includes("'--") || 
                    username.includes("' #") || username.includes("1=1") ||
                    password.includes("' OR '")) {
                    
                    // Simulasi SQL injection berhasil
                    return {
                        success: true,
                        message: "SQL INJECTION BERHASIL! Anda berhasil login tanpa password valid!",
                        type: "injection"
                    };
                }
                
                // Login normal
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    return {
                        success: true,
                        message: "Login berhasil! Selamat datang " + user.username,
                        type: "normal"
                    };
                } else {
                    return {
                        success: false,
                        message: "Username atau password salah!",
                        type: "error"
                    };
                }
            }
            
            const result = checkLogin(username, password);
            const resultDiv = document.getElementById('result');
            
            // Tampilkan hasil
            resultDiv.className = 'result';
            if (result.success) {
                if (result.type === "injection") {
                    resultDiv.classList.add('success');
                    resultDiv.innerHTML = `
                        <strong>✅ ${result.message}</strong><br>
                        <small>Query: ${sqlQuery}</small>
                    `;
                } else {
                    resultDiv.classList.add('success');
                    resultDiv.innerHTML = `
                        <strong>✅ ${result.message}</strong><br>
                        <small>Query: ${sqlQuery}</small>
                    `;
                }
            } else {
                resultDiv.classList.add('error');
                resultDiv.innerHTML = `
                    <strong>❌ ${result.message}</strong><br>
                    <small>Query: ${sqlQuery}</small>
                `;
            }
        });
    </script>
</body>
</html>
